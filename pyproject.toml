[project]
name = "cas"
version = "0.1.0"
description = "Customer Analytics Suite: Churn, NBP/NBO, CLV — end-to-end ML system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "lifetimes>=0.11.3",
    "mlxtend>=0.23",
    "shap>=0.45",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "imbalanced-learn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.22",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
[tool.coverage.run]
source = ["src/cas"]
omit = [
    "src/cas/churn/train.py",
    "src/cas/nbo/train.py",
    "src/cas/clv/train.py",
    "src/cas/churn/data.py",
    "src/cas/nbo/data.py",
    "src/cas/clv/data.py",
    "src/cas/common/config.py",
]
testpaths = ["tests"]
addopts = "-v --cov=src/cas --cov-report=term-missing"
